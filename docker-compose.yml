# Запуск всей системы одной командой:  docker compose up -d --build
# После запуска: http://localhost:8000  (документация API — /api/docs)
name: vols-gis

services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vols}
      POSTGRES_USER: ${POSTGRES_USER:-vols}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vols}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Наружу только на localhost — чтобы подключаться к базе из DBeaver/pgAdmin.
      # 5433, а не стандартный 5432: на рабочем ноутбуке 5432 часто занят своим PostgreSQL.
      - "127.0.0.1:${DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vols}:${POSTGRES_PASSWORD:-vols}@db:5432/${POSTGRES_DB:-vols}
      SECRET_KEY: ${SECRET_KEY:-dev-only-secret-change-me-on-server-0123456789}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      MONITORING_MODE: ${MONITORING_MODE:-simulate}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-8000}:8000"

volumes:
  pgdata:
  uploads:
