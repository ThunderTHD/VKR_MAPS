[project]
name = "vols-gis"
version = "0.1.0"
description = "ГИС учёта ВОЛС с автоматизированной локализацией повреждений (ВКР, КФУ)"
requires-python = ">=3.12"
dependencies = [
    # Веб и API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "pydantic-settings>=2.4",
    # База данных и геоданные
    "sqlalchemy>=2.0.30",
    "geoalchemy2>=0.15",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    # Авторизация (пароли хэшируются стандартным scrypt из hashlib — без нативных пакетов)
    "pyjwt>=2.9",
    # Алгоритмы
    "networkx>=3.3",
    # Фоновые задачи
    "apscheduler>=3.10,<4",
    # Импорт и документы
    "lxml>=5.2",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pytesseract>=0.3.10",
    "pillow>=10.4",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]
# Тяжёлые дополнения ставятся отдельно, чтобы не раздувать основной образ
easyocr = ["easyocr>=1.7"]       # тянет PyTorch (~2 ГБ) — только для бенчмарка OCR
shapefile = ["pyogrio>=0.9"]     # импорт Shapefile
msk = ["pyproj>=3.6"]            # пересчёт из местных систем координат на стороне Python

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008"]  # Depends(...) в аргументах по умолчанию — штатный приём FastAPI

[tool.ruff.lint.isort]
# Папка alembic/ с миграциями — не наш пакет: импорт `alembic` — это библиотека
known-third-party = ["alembic"]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# В автогенерируемых миграциях импорты нужны «на всякий случай», а строки бывают длинными
"alembic/versions/*" = ["F401", "E501"]
