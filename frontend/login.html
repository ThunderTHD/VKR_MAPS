<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14213d">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="/img/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/img/icons/apple-touch-icon.png">
  <title>Вход — ГИС ВОЛС</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <form id="login" class="login-card" autocomplete="on">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>ГИС ВОЛС</div>
    <p class="muted">Учёт волоконно-оптических линий связи</p>
    <label>Логин
      <input name="login" autocomplete="username" required autofocus>
    </label>
    <label>Пароль
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <p id="error" class="form-error" role="alert" hidden></p>
    <button type="submit" class="btn btn-primary">Войти</button>
  </form>
  <script type="module" src="js/login.js"></script>
  <script type="module" src="/js/pwa.js"></script>
</body>
</html>
